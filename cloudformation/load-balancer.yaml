AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Creates an Application Load Balancer for the highly available AWS web application architecture.

Parameters:

  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the load balancer will be created

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet

  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group for the Application Load Balancer

Resources:

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ha-webapp-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroupId
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: ha-webapp-alb

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ha-webapp-targets
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VPCId
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: 200

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:

  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the web server target group
    Value: !Ref WebTargetGroup

  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer