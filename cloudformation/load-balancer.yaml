AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Creates an Application Load Balancer for the highly available AWS web application architecture.

Parameters:

  VPCStackName:
    Type: String
    Default: ha-webapp-vpc
    Description: Name of the CloudFormation stack containing the VPC

  SecurityGroupStackName:
    Type: String
    Default: ha-webapp-security
    Description: Name of the CloudFormation stack containing the security groups

Resources:

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ha-webapp-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - Fn::ImportValue:
            !Sub '${SecurityGroupStackName}-ALBSecurityGroupId'
      Subnets:
        - Fn::ImportValue:
            !Sub '${VPCStackName}-PublicSubnetAZ1Id'
        - Fn::ImportValue:
            !Sub '${VPCStackName}-PublicSubnetAZ2Id'
      Tags:
        - Key: Name
          Value: ha-webapp-alb

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ha-webapp-targets
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue:
          !Sub '${VPCStackName}-VPCId'
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: 200

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:

  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the web server target group
    Value: !Ref WebTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'

  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer