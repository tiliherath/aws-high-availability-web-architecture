AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Creates the VPC for the highly available AWS web application architecture.

Resources:

  ApplicationVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: HA-WebApp-VPC
